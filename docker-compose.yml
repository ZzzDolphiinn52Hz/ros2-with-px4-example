services:
  ros:
    build:
      context: .
      network: host
    network_mode: host
    ipc: host
    privileged: true
    working_dir: /ros2_ws
    environment:
      - ROS_DOMAIN_ID=0
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./:/ros2_ws
      - /dev:/dev
      - ${UAV_MODELS_DIR:-${HOME}/models}:/models:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true
    command: bash

  xrce-agent:
    build:
      context: .
      dockerfile: Dockerfile.xrce-agent
      network: host
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
    # Raspberry Pi 5 GPIO header pins 8/10 expose UART0 as ttyAMA0.
    # /dev/serial0 points to the separate three-pin debug UART (ttyAMA10).
    command: ["serial", "--dev", "/dev/ttyAMA0", "-b", "921600"]
    restart: unless-stopped
