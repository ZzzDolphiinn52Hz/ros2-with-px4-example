<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="420mm" height="297mm" viewBox="0 0 420 297">
  <title>9x6 inner-corner checkerboard, 30 mm squares, A3 landscape</title>
  <defs>
    <pattern id="checker" width="60" height="60"
             patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="30" height="30" fill="#000000"/>
      <rect x="30" y="30" width="30" height="30" fill="#000000"/>
    </pattern>
  </defs>
  <rect width="420" height="297" fill="#ffffff"/>
  <!-- 10 x 7 squares create 9 x 6 detectable inner corners. -->
  <rect x="60" y="43.5" width="300" height="210" fill="#ffffff"/>
  <rect x="60" y="43.5" width="300" height="210"
        fill="url(#checker)"/>
</svg>
