zipdepth_node:
  ros__parameters:
    image_topic: /camera/front/image_raw
    # IMX219 host frames go directly through a local Unix socket, avoiding DDS
    # serialization and unstable /dev/videoN assignments.
    camera_device: ''
    camera_socket_path: /ros2_ws/run/front_camera.sock
    camera_width: 640
    camera_height: 480
    camera_capture_fps: 15.0
    camera_pixel_format: RGB888
    camera_frame_id: front_camera_optical_frame
    # The installed nose IMX219 is rolled 180 degrees. Normalize the image
    # before inference so published L/C/R matches vehicle left/centre/right.
    rotate_input_180: true
    publish_input_image: false
    model_path: /models/zipdepth_base_npu_512x384.onnx
    onnx_threads: 3
    # 0.0 disables software throttling. The Pi runs as fast as inference allows
    # Inference and the IMX219 host stream determine actual throughput.
    maximum_processing_rate_hz: 0.0

    # ZipDepth outputs affine-invariant inverse depth. Keep metric outputs
    # invalid until scale/shift have been fitted in disparity space (1/metre)
    # against known distances from the real camera.
    metric_calibration_enabled: false
    inverse_depth_scale: 1.0
    inverse_depth_shift_per_m: 0.0
    minimum_depth_m: 0.3
    maximum_depth_m: 8.0
    near_percentile: 15.0
    roi_top_fraction: 0.25
    roi_bottom_fraction: 0.78

    raw_topic: /uav/depth/zipdepth_raw
    metric_depth_topic: /camera/depth/image
    visualization_topic: /uav/depth/visualization
    pointcloud_topic: /camera/depth/points
    free_space_topic: /uav/depth/free_space
    relative_free_space_topic: /uav/depth/relative_free_space
    relative_corridor_topic: /uav/depth/relative_corridor
    status_topic: /uav/depth/status
    relative_near_percentile: 85.0
    relative_minimum_contrast_span: 0.001

    # Fixed-size 2D opening search. Fractions refer to the 512x384 model map.
    # This is relative-only shadow guidance, not a metric fit guarantee.
    corridor_roi_top_fraction: 0.08
    corridor_roi_bottom_fraction: 0.92
    corridor_width_fraction: 0.32
    corridor_height_fraction: 0.32
    corridor_sampling_stride: 4
    corridor_stride_fraction: 0.04
    corridor_clearance_percentile: 20.0
    corridor_minimum_clearance: 0.10
    corridor_minimum_valid_fraction: 0.90
    corridor_centre_bias: 0.12

    # Debug publishers are selected through launch arguments, like the Jetson
    # pipeline. PointCloud and metric depth remain blocked until calibration.
    pointcloud_stride: 4
    pointcloud_frame_id: front_camera_link
    focal_x_px: 430.0
    focal_y_px: 430.0
    principal_x_px: -1.0
    principal_y_px: -1.0
