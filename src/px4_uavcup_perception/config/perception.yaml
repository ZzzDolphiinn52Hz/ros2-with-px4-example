gz_image_bridge:
  ros__parameters:
    use_sim_time: true
    ros_image_topic: /uav/front_camera/image_raw
    ros_camera_info_topic: /uav/front_camera/camera_info
    frame_id: front_camera_link
    horizontal_fov_rad: 1.3962634
    publish_rate_hz: 20.0
    publish_clock: true
    output_width: 320
    output_height: 240

depth_anything_node:
  ros__parameters:
    use_sim_time: true
    input_topic: /uav/front_camera/image_raw
    depth_topic: /uav/depth/image
    visualization_topic: /uav/depth/visualization
    status_topic: /uav/depth/status
    repository_path: ~/ros2_ws/third_party/Depth-Anything-V2
    checkpoint_path: ~/ros2_ws/models/depth_anything_v2_metric_hypersim_vits.pth
    encoder: vits
    maximum_depth_m: 20.0
    # CPU development setting. Use 518 on a GPU/NPU after benchmarking.
    input_size: 252
    device: auto
    retry_model_load_s: 5.0

free_space_node:
  ros__parameters:
    use_sim_time: true
    depth_topic: /uav/depth/image
    output_topic: /uav/depth/free_space
    status_topic: /uav/depth/free_space_status
    minimum_depth_m: 0.15
    maximum_depth_m: 20.0
    near_percentile: 15.0
    roi_top_fraction: 0.25
    roi_bottom_fraction: 0.85
    minimum_valid_fraction: 0.25
