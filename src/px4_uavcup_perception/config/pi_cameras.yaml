down_picamera:
  ros__parameters:
    # Frames are captured from the down-facing IMX500 by Picamera2 on the
    # Raspberry Pi OS host and transferred locally into the ROS container.
    # Keep these intrinsics synchronized with config/aruco.yaml after running
    # docs/IMX500_CALIBRATION.md at the same 640x480 preview mode.
    socket_path: /ros2_ws/run/down_camera.sock
    width: 640
    height: 480
    frame_id: down_camera_optical_frame
    image_topic: /camera/down/image_raw
    camera_info_topic: /camera/down/camera_info
    distortion_model: plumb_bob
    # IMX500 640x480 calibration, 2026-11-15. Robust fit retained 36/45
    # checkerboard views after rejecting outliers; reprojection RMS=0.531 px.
    camera_matrix: [480.125104, 0.0, 320.272190,
                    0.0, 480.224260, 228.696135,
                    0.0, 0.0, 1.0]
    distortion_coefficients: [-0.015577,
                              0.160202,
                              -0.005259,
                              0.002837,
                              0.0]
