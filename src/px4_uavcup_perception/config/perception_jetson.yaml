jetson_depth_node:
  ros__parameters:
    use_sim_time: false

    # Existing TensorRT engine on the Xavier NX. Backend code is versioned in
    # this ROS package; the large generated engine stays outside Git.
    engine_path: ~/Depth-Anything-V2/metric_depth/depth_anything_v2_metric_hypersim_vits_364_fp16.engine

    camera_device: /dev/video0
    use_gstreamer: true
    # Leave empty to construct the low-latency pipeline from the values below.
    gstreamer_pipeline: ''
    capture_width: 1280
    capture_height: 720
    capture_fps: 30
    model_input_size: 364
    processing_rate_hz: 30.0
    warmup_iterations: 3

    # Provisional fit from measured centre-sector samples. The capture path
    # centre-crops 1280x720 to 720x720 before resizing to 364x364 so geometry
    # is preserved. Refit these values after collecting the new crop dataset.
    depth_calibration_scale: 0.54856
    depth_calibration_bias_m: 0.22176

    # Monocular depth always returns a value, even for a covered lens. Reject
    # dark, saturated or textureless frames before inference and require a
    # stable recovery before publishing usable distances again.
    camera_health_enabled: true
    health_sample_stride: 4
    health_minimum_brightness: 8.0
    health_maximum_brightness: 247.0
    health_minimum_contrast_stddev: 6.0
    health_minimum_gradient_mean: 2.0
    health_maximum_dark_fraction: 0.98
    health_maximum_bright_fraction: 0.98
    health_failure_frames: 3
    health_recovery_frames: 5

    camera_frame_id: camera_link
    minimum_depth_m: 0.3
    maximum_depth_m: 8.0
    near_percentile: 15.0
    # Ignore most sky/ceiling and the lower floor region.
    roi_top_fraction: 0.25
    roi_bottom_fraction: 0.78
    minimum_valid_fraction: 0.25

    free_space_topic: /uav/depth/free_space
    status_topic: /uav/depth/status
    depth_topic: /camera/depth/image
    visualization_topic: /uav/depth/visualization
    pointcloud_topic: /camera/depth/points

    # Debug publishers are controlled only by launch arguments. Do not repeat
    # them here: Foxy gives exact-node YAML values precedence over the launch
    # override dictionary.

    # Point-cloud parameters are used only when debug publication is enabled.
    pointcloud_stride: 4
    focal_x_px: 300.0
    focal_y_px: 300.0
    # Negative values automatically use the depth image centre.
    principal_x_px: -1.0
    principal_y_px: -1.0
