cmd_vel_to_px4:
  ros__parameters:
    cmd_vel_topic: /aruco_land/cmd_vel
    local_position_topic: /fmu/out/vehicle_local_position_v1
    attitude_topic: /fmu/out/vehicle_attitude
    vehicle_status_topic: /fmu/out/vehicle_status_v1
    land_detected_topic: /fmu/out/vehicle_land_detected
    target_altitude_m: 0.70
    # Enabling the adapter holds the estimator's current Z. The configured
    # altitude is only used when this option is explicitly disabled.
    hold_current_altitude_on_enable: true
    max_xy_speed_m_s: 0.35
    max_yaw_rate_rad_s: 0.25
    max_xy_accel_m_s2: 0.30
    max_yaw_accel_rad_s2: 0.40
    allow_vertical_cmd_vel: true
    minimum_target_altitude_m: 0.20
    maximum_target_altitude_m: 3.0
    max_vertical_speed_m_s: 0.20
    max_vertical_accel_m_s2: 0.20
    cmd_timeout_s: 0.40
    publish_rate_hz: 20.0
